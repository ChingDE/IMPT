version: "3.9"

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  worker:
    build: .
    restart: unless-stopped
    command: >
      celery -A worker.celery_app.celery_app worker
        --loglevel=info
        --concurrency=2
        --max-tasks-per-child=10
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock

  beat:
    build: .
    restart: unless-stopped
    command: >
      celery -A worker.celery_app.celery_app beat
        --loglevel=info
        --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment:
      PYTHONPATH: /app

volumes:
  uploads:
