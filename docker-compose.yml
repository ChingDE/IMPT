# ─────────────────────────────────────────────────────────────────────────────
# IMPT — Production Docker Compose (Cloud Architecture)
#
# What runs HERE (DigitalOcean Droplet, Singapore):
#   api     — FastAPI application server
#   worker  — Celery worker (runs mutation testing jobs via Docker)
#   beat    — Celery beat (watchdog scheduler)
#
# What runs ELSEWHERE (managed cloud services):
#   PostgreSQL → DigitalOcean Managed Database (same DC, private network)
#   Redis      → Upstash (TLS, free tier)
#   Frontend   → Vercel (CDN)
#
# Usage:
#   cp .env.example .env     # fill in all CHANGE_ME values
#   docker build -t impt-sandbox:latest ./sandbox/
#   docker compose up -d --build
#   docker compose exec api alembic upgrade head
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── FastAPI application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"      # Exposed to Caddy reverse proxy on the host
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  # ── Celery worker ──────────────────────────────────────────────────────────
  # concurrency=1 is intentional for 2 vCPU / 4 GB Droplet.
  # Prevents two mutation jobs from competing for resources simultaneously.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A worker.celery_app.celery_app worker
        --loglevel=info
        --concurrency=1
        --max-tasks-per-child=10
    env_file: .env
    environment:
      PYTHONPATH: /app
    volumes:
      - uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock

  # ── Celery beat (job watchdog) ─────────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A worker.celery_app.celery_app beat
        --loglevel=info
        --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment:
      PYTHONPATH: /app

volumes:
  uploads:
