# NFR080: Log rotation configuration for IMPT
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/impt

/var/log/impt/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 imptuser imptuser
    sharedscripts
    postrotate
        docker compose -f /home/imptuser/impt/docker-compose.yml kill -s USR1 api 2>/dev/null || true
    endscript
}

/home/imptuser/impt/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    maxsize 100M
    create 0640 imptuser imptuser
}
