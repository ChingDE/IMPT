[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impt"
version = "0.1.0"
description = "Intelligent Mutation Prioritization Tool"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.19",
]

[tool.pytest.ini_options]
testpaths  = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["impt", "api", "db", "worker", "config"]
omit   = ["tests/*", "cli/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under   = 70
